</style><body><main class="shell"><aside class="intro"><div class="brand">GYMLOG / DESIGN REVIEW</div><h1>把注意力<br>留給訓練。</h1><p class="lede">保留熟悉的操作。<br>讓重量、實際成績與計時更易讀。<br>僅調整 UI，不改業務邏輯。</p><div class="tools"><button class="outline" id="theme" onclick="toggleTheme()">切換深色</button><a href="design-spec.md" style="align-self:center;font-size:13px">設計規格 ↗</a></div><nav class="review-nav" id="reviewnav" aria-label="評審畫面"></nav><div class="readme">2026.09.22 · 待使用者審核<br>所有學員與數據均為合成示例。<br>按鈕只演示介面，不保存或發送資料。<br>手機內可滾動；右側說明區分現狀與提案。</div></aside><section class="phone" aria-label="GymLog 介面原型"><div class="status"><span>9:41</span><span>▮▮▮  ▰</span></div><div class="app-top"><button class="client" onclick="showSheet('學員切換',menu(['Alex · 當前學員','新增學員','編輯學員資料'])+'<p class=small>保留原未保存草稿切換保護。此處不切換真實資料。</p>')">Alex⌄</button><button class="add-client" aria-label="新增學員" onclick="info('新增學員','保留姓名及全部現有檔案欄位與原保存流程。')">+</button></div><div class="screen" id="screen"></div><button class="mic" aria-label="全局語音" onclick="voice()"><svg width="22" height="27" viewBox="0 0 22 27" aria-hidden="true"><rect x="7" y="1" width="8" height="16" rx="4" fill="currentColor"/><path d="M3 11v3a8 8 0 0016 0v-3M11 22v4M6 26h10" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><nav class="tabbar" id="tabbar" aria-label="應用分頁"></nav><div class="homebar"></div><div class="modal" id="modal" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle"><div class="handle"></div><div class="row spread"><h3 id="sheettitle"></h3><button class="link" onclick="closeSheet()">完成</button></div><div id="sheetbody"></div></div></div><div class="toast" id="toast" role="status"></div></section><aside class="notes" id="notes"></aside></main>
<script>

pread"><h3>槓鈴背蹲</h3><span class="tag neutral">推斷</span></div><div class="sub">Back Squat · 休息60s</div>${row('第1組','80 kg × 10次')}${row('第2組','80 kg × 10次')}${row('第3組','80 kg × 10次')}<p class="small" style="margin:8px 0 0">本區塊全部為推斷；混合來源仍逐組標記。</p>`)}${card(`<div class="eyebrow">SUPERSET · 輪間休息60s</div>${row('A1 啞鈴臥推','20 kg × 10次')}${row('A2 坐姿划船','35 kg × 12次')}`)}${card(menu(['運動消耗 · 查看估算依據','AI 訓練評價 · 展開／生成','暖身、收操及其餘原內容']))}`}function chart(){return `<svg class="chart" viewBox="0 0 320 145" role="img" aria-label="合成體重趨勢，9月1日75.2公斤，9月10日74.9公斤，9月22日74.6公斤"><line x1="25" y1="30" x2="309" y2="30"/><line x1="25" y1="95" x2="309" y2="95"/><text x="0" y="33">76</text><text x="0" y="98">74</text><path d="M35 55 L165 66 L298 78"/><circle cx="35" cy="55" r="4"/><circle cx="165" cy="66" r="4"/><circle cx="298" cy="78" r="4"/><text x="22" y="129">9/1</text><text x="151" y="129">9/10</text><text x="277" y="129">9/22</text></svg>`}function profile(){return `<h2>學員檔案</h2>${card(`<div class="row spread"><div><h3>Alex</h3><span class="small">合成學員 · 檔案資料</span></div>${btn('編輯',"showSheet('檔案欄位',menu(['姓名／電話／性別／年齡','身高／起始體重','目標／訓練頻率／BMR／TDEE','習慣／病史','保存資料']))",'link')}</div>`)}<div class="row spread section-header"><h3>身體組成</h3><span class="small">9月22日</span></div>${card(`<div class="metrics">${[['體重','74.6','kg','−0.3 kg'],['體脂率','18.4','%','−0.2 pp'],['骨骼肌','34.2','kg','+0.1 kg']].map(([l,v,u,d])=>`<div><small>${l}</small><b class="numbers">${v}</b><small>${u}</small><div class="small" style="margin-top:8px">${d}</div></div>`).join('')}</div><p class="small" style="margin:6px 0 0">相較上一筆 · 中性變化，不判定好壞</p>`)}${card(`<div class="row spread"><h3>體重趨勢</h3>${btn('體重⌄',"info('趨勢指標','沿用現有指標切換與缺值處理；原型僅畫體重合成示例。')",'link')}</div>${chart()}`)}<div class="row">${btn('＋ 手動新增',"info('新增 InBody','日期及全部十項數值／備註保留，缺值不補零。')",'secondary')}${btn('掃描報告',"info('掃描報告照片','保留相片、辨識、逐欄核對、確認保存；不自動接受 OCR 結果。')",'secondary')}</div><div class="eyebrow section-header">歷史記錄</div>${card(`<button class="record" onclick="go('inbody')">${row('2026年9月22日','›')}<span class="small">74.6 kg　18.4%　SMM 34.2 kg</span></button>`)}${card(menu(['基本信息','訓練目標','習慣與病史','保存資料']))}`}function inbody(){return `${btn('‹ 學員檔案',"go('profile')",'back')}<div class="row spread"><h2>InBody 記錄</h2>${btn('編輯',"info('編輯體測','沿用 AddBodyMetricSheet 原欄位、驗證及保存。')",'link')}</div><div class="sub">2026年9月22日 · 合成數據</div>${card(`<div class="eyebrow">測量數據</div>${row('體重','74.6 kg')}${row('體脂率','18.4 %')}${row('體脂重','13.7 kg')}${row('骨骼肌量','34.2 kg')}${row('BMI','23.5')}${row('內臟脂肪等級','6')}${row('BMR','—')}${row('TDEE','—')}`)}${card(`<h3>備註</h3><p class="small">— 未填寫</p>${btn('查看原組成／指標展示',"info('原組成與指標展示','實作保留現有組成圖及 BMI／內臟脂肪區間條的可達性與原口徑。本次不新增醫療標準，原型用中性數值表。')",'link')}`)}${btn('刪除這條記錄',"info('刪除確認','保留原不可復原提示及刪除失敗狀態。本原型不執行刪除。')",'danger')}`}function library(){return `<div class="row spread"><h2>動作庫</h2>${btn('＋',"info('新增動作','名稱／中文名／說明與分類、器械、記錄方式、體系、單側、負重方向、待復核皆保留。')",'link')}</div><div class="seg">${['動作','Superset','WOD','組合'].map((s,i)=>`<button class="${i===0?'selected':''}" onclick="${i===0?'go(\'library\')':`info('${s}模板','保留該類別既有預覽、選擇與管理能力；不從原型推論新增編輯權限。')`}">${s}</button>`).join('')}</div><input class="search" placeholder="搜尋動作" aria-label="搜尋動作庫" oninput="document.getElementById('exlist').innerHTML=exerciseList(this.value)">${card(`<div id="exlist">${exerciseList()}</div>`)}${btn('動作庫管理',"showSheet('管理',menu(['篩選分類','編輯動作全部欄位','合並到其他動作','撤銷上次合並','刪除動作','清空全部動作']))",'link')}`}function chooseTheme(value){themeSelection=value;const isDark=value==='dark'||(value==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',isDark);$('theme').textContent=isDark?'切換淺色':'切換深色';render()}
function themeSelector(){return `<div class="theme-choices" role="radiogroup" aria-label="外觀">${[['system','跟隨系統'],['light','淺色'],['dark','深色']].map(([value,label])=>`<button class="theme-choice" role="radio" aria-checked="${themeSelection===value}" onclick="chooseTheme('${value}')"><span>${label}</span><span class="check" aria-hidden="true">${themeSelection===value?'✓':''}</span></button>`).join('')}</div><div class="theme-previews" aria-label="淺色與深色外觀縮略預覽">${[['light','淺色'],['dark','深色']].map(([value,label])=>`<div class="theme-mini ${value} ${themeSelection===value?'selected':''}" role="img" aria-label="${label}外觀預覽${themeSelection===value?'，已選取':''}"><div class="theme-mini-drawing"><div class="theme-mini-title"></div><div class="theme-mini-pill"></div><div class="theme-mini-accent"></div></div></div>`).join('')}</div>`}
function settings(){return `<h2>設置</h2><div class="eyebrow">外觀</div>${card(themeSelector())}<div class="eyebrow section-header">語言</div>${card(menu(['繁體中文／English']))}<div class="eyebrow section-header">備份與恢復</div>${card(menu(['導出完整備份','從備份恢復']))}<p class="small">保留原恢復預覽、歸屬衝突與跳過數量；不刪除本機既有資料。</p><div class="eyebrow section-header">教練學員互傳</div>${card(menu(['從文件匯入分享的計劃／結果','貼上分享文字']))}<div class="eyebrow section-header">關於與語音</div>${card(menu(['版本與構建號','雲端語音設定']))}<p class="small">服務連接檢查及原保存設定流程保留。不在評審頁載入密鑰。</p>`}function voice(){showSheet('語音記錄',`<p class="small">Alex · 2026年9月22日</p><h3>說出今天的訓練計劃</h3><p class="small">實際成績只按明確口述記錄。</p>${btn('開始錄音（示例）',"toast('原型不使用麥克風；保留原錄音／停止／取消流程')",'primary')}${menu(['改用文字輸入','編輯原話後重試','補充澄清','確認修改已有成績','撤銷上一句','查看今天的計劃'])}<p class="small">上述狀態在正式介面依原條件出現；這裡集中列示保留範圍。</p>`)}
const descriptions={today:['今天：讓實際成績一眼可辨','當前程式已有休息圓環與心率。此次只調整數字、目標／實際與操作層級。','未記錄不等於零，也不等於目標；保留「記錄此數值」與「清除實際成績」。','點擊數值打開示例滾輪。整堂完成獨占一行；其下暫存／放棄全寬等分、各自居中，並保留底部安全空間。'],superset:['Superset：看清輪次與從屬','沿用現有多動作、輪間休息、加輪、補缺輪與解散能力。','A1／A2 只用來分層；不把兩個動作成績合成一筆。','點擊更多查看排序／解散；末尾休息仍是原本操作。'],wod:['WOD：處方先清楚','現有程式已有三段及收合；改善欄位層級，不新增計時算法。','類型、數量單位、不同輪數、負重與標準必須全部保留。','選類型後按開始計時查看代表狀態。'],live:['現場：時鐘不是成績','AMRAP、EMOM、Interval 按現有 phase 倒數。For Time 有 cap 目前亦顯示剩餘；無 cap 才正數。','不因視覺環方向改變 model；手動完成本輪、撤銷及單 WOD owner 保留。','所有數字固定示例；按暫停／繼續只改示例狀態。'],result:['成績：保留獨立語義','四種狀態、格式專屬數值、Rx／Scaled／未指定、備註都存在於當前實作。','計時與保存整堂課不合併；不猜測完成輪數或總量。','狀態與版本可選，無資料寫入；正式欄位顯示條件照原程式。'],picker:['選動作：有層次地掃讀','現有常用、字母分組、分類與全庫搜尋已實作。只統一名稱層級與模式錨點。','WOD 自由名稱入口保留；力量仍需正式 Exercise。','搜尋可過濾本頁合成資料；分類只演示選中樣式。'],history:['歷史：先看練了什麼','週分組、月力量量色帶與課次摘要都已實作。','不把 WOD-only 量為零解釋為缺席；不新增 PR 算法。','點擊課次進入詳情；更多仍可看到匯入／匯出／分享／清空。'],detail:['詳情：數據先於說明','沿用摘要、逐組、推斷來源、消耗與 AI 功能。','缺資料提示可以收合但不可消失；混合推斷需逐組標記。','完整編輯、快速修正、分享與存為模板皆在更多。'],profile:['體測：可讀，不加診斷','当前已有三指標概覽、差值、趨勢與歷史卡片。','新設計不發明健康標準；未填值保持缺失，OCR 必須核對。','點擊歷史記錄進入詳情；檔案全部欄位仍可達。'],inbody:['InBody：每個欄位都能核對','來源已具備編輯、刪除、組成圖及指標區間。','原型用中性數值展示；正式版仍保留原圖表可達性與口徑。','— 表示未填，不能轉為0；SMM 與脂重不能混同。'],library:['不遺失管理功能','除了六組主要畫面，四種庫及合併／撤銷／刪除／清空都列入保留契約。','模板只沿用各頁目前已有能力，不推論新功能。','可搜尋合成動作；管理入口展示完整保留範圍。'],settings:['設定：保持直接','外觀保留跟隨系統／淺色／深色文字選項，以及現行兩張圖示式縮略預覽；其餘設定全部保留。','匯入部分成功與衝突數量必须顯示；不新增帳戶或同步。','外觀文字選擇可切換原型配色與預覽選取框。跟隨系統時兩張預覽都不加選取框，與現行程式一致。']};function go(p){page=p;closeSheet();render();$('screen').scrollTop=0}function render(){$('screen').innerHTML=({today,superset,wod,live,result,picker,history,detail,profile,inbody,library,settings})[page]();$('reviewnav').innerHTML=pages.map(([id,n,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${n}</span>${t}</button>`).join('');let tab=['profile','inbody'].includes(page)?'profile':['history','detail'].includes(page)?'history':['library','settings'].includes(page)?page:'today';$('tabbar').innerHTML=[['today','☼','今天'],['profile','▤','個人信息'],['history','◷','歷史'],['library','⌘','動作庫'],['settings','⚙','設置']].map(([id,i,t])=>`<button class="${tab===id?'on':''}" onclick="go('${id}')"><i aria-hidden="true">${i}</i>${t}</button>`).join('');let d=descriptions[page];$('notes').innerHTML=`<span class="flag">僅供設計評審 · 合成示例</span><h3>${d[0]}</h3><p>${d[1]}</p><div class="note-item"><b>功能保留界線</b><span>${d[2]}</span></div><div class="note-item"><b>可以操作的評審原型</b><span>${d[3]}</span></div><div class="note-item"><b>視覺取捨</b><span>延續既有色彩、圓角與五 Tab。強化數值層級、44pt 操作與清楚的狀態文字；低頻功能保留在原更多／表單入口。</span></div><div class="note-foot">HTML 原型不等於 SwiftUI 實作或真機驗收。<br>需使用者批准後，才交由 Sol 實作。<br><br><a href="source-contact-sheet.jpg">查看舊合成畫面總覽 ↗</a></div>`}render();
