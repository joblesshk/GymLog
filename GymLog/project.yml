name: GymLog
options:
  bundleIdPrefix: com.gymlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig
settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_NAME: "$(TARGET_NAME)"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "31"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
  configs:
    Debug:
      ENABLE_TESTABILITY: "YES"
targets:
  GymLogKit:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Models
      - path: Sources/Import
      - path: Sources/AppState
      - path: Sources/Analytics
      - path: Sources/Export
      - path: Sources/Exchange
      - path: Sources/VoiceCommand
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GYMLOG_KIT_BUNDLE_IDENTIFIER)"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        INSTALL_PATH: "$(LOCAL_LIBRARY_DIR)/Frameworks"
        DYLIB_COMPATIBILITY_VERSION: "1"
        DYLIB_CURRENT_VERSION: "1"
        CURRENT_PROJECT_VERSION: "$(inherited)"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  GymLog:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
      - path: Sources/Views
      - path: Resources
    dependencies:
      - target: GymLogKit
        embed: true
    info:
      path: Resources/Info.plist
      properties:
        GymLogRelayBaseURL: "$(GYMLOG_RELAY_BASE_URL)"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.example.gymlog.share
            UTTypeDescription: "GymLog Share Package"
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - gymlogshare
        CFBundleDocumentTypes:
          - CFBundleTypeName: "GymLog Share Package"
            LSItemContentTypes:
              - org.example.gymlog.share
            LSHandlerRank: Owner
            CFBundleTypeRole: Editor
          - CFBundleTypeName: "GymLog Share Text"
            LSItemContentTypes:
              - public.json
              - public.plain-text
            LSHandlerRank: Alternate
            CFBundleTypeRole: Editor
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GYMLOG_APP_BUNDLE_IDENTIFIER)"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "GymLog"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "訓練時連接你的心率手環（如 Garmin CIRQA），在課次進行中顯示即時心率。"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "錄下訓練指令並傳送至你設定的雲端語音識別服務，用來安排與修改訓練。"

        CURRENT_PROJECT_VERSION: "$(inherited)"

  GymLogTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GymLogTests
      - path: Fixtures
      - path: Resources
    dependencies:
      - target: GymLogKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymlog.tests
        GENERATE_INFOPLIST_FILE: YES

  GymLogUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GymLogUITests
    dependencies:
      - target: GymLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymlog.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GymLog:
    build:
      targets:
        GymLogKit: all
        GymLog: all
        GymLogTests: [test]
    test:
      targets:
        - GymLogTests
    run:
      config: Debug
  GymLogKitTests:
    build:
      targets:
        GymLogKit: all
        GymLogTests: [test]
    test:
      targets:
        - GymLogTests
  GymLogUITests:
    build:
      targets:
        GymLogKit: all
        GymLog: all
        GymLogUITests: [test]
    test:
      targets:
        - GymLogUITests
